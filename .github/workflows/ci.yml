name: CI

on:
  push:
  pull_request:

jobs:
  train-and-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest -q

      - name: Train the chatbot (quick run)
        run: uv run python -m chatbot.train --epochs 5

      - name: Ask the chatbot a question
        run: uv run python -m chatbot.chat --message "hi"
